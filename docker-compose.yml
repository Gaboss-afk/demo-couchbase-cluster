services:
  couchbase-node1:
    image: couchbase:latest
    container_name: couchbase-node1
    hostname: couchbase-node1.demo.test
    ports:
      - "8091-8094:8091-8094"
      - "11210:11210"
    networks:
      couchbase-net:
        aliases:
          - couchbase-node1.demo.test
    volumes:
      - couchbase-node1-data:/opt/couchbase/var

  couchbase-node2:
    image: couchbase:latest
    container_name: couchbase-node2
    hostname: couchbase-node2.demo.test
    networks:
      couchbase-net:
        aliases:
          - couchbase-node2.demo.test
    volumes:
      - couchbase-node2-data:/opt/couchbase/var

  couchbase-node3:
    image: couchbase:latest
    container_name: couchbase-node3
    hostname: couchbase-node3.demo.test
    networks:
      couchbase-net:
        aliases:
          - couchbase-node3.demo.test
    volumes:
      - couchbase-node3-data:/opt/couchbase/var

volumes:
  couchbase-node1-data:
  couchbase-node2-data:
  couchbase-node3-data:

networks:
  couchbase-net:
    driver: bridge